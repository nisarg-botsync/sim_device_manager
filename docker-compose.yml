services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_PATH: /app/data/db.sqlite3
    ports:
      - "8005:8000"
      # Modbus TCP simulator ports
      - "5020-5099:5020-5099"
      # EthernetIP/CIP simulator ports
      - "44818-44899:44818-44899"
    volumes:
      - sqlite_data:/app/data
    networks:
      - syncos_default

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - syncos_default

volumes:
  sqlite_data:

networks:
  syncos_default:
    external: true
