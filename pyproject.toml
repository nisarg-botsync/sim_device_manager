[project]
name = "sim-device-manager"
version = "0.1.0"
description = "Industrial protocol simulation platform — Modbus & EthernetIP device simulator with Django REST backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "pymodbus>=3.6",
    "cpppo>=4.4",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["backend"]
markers = [
    "integration: marks tests that start real subprocesses (deselect with '-m not integration')",
]

[tool.django-stubs]
django_settings_module = "core.settings"
